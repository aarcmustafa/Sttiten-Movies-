name: sttiten_movies
description: تطبيق Sttiten Movies للأفلام والمسلسلات مع دعم الترجمة العربية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.16
  video_player: ^2.9.2
  chewie: ^1.8.5
  package_info_plus: ^8.1.2
  flutter_cache_manager: ^3.4.1
  flutter_launcher_icons: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/app_icon.png"
